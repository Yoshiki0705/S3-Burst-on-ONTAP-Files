name: pr-title-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The commit job below checks out the branch, which `contents: read` already allows.
permissions:
  contents: read

# `edited` fires on every keystroke-saved title change, so a rename produces a run per edit. Only
# the last one is about the title as it now stands.
concurrency:
  group: pr-title-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      # This job validates a string, not history, so a shallow checkout is enough. It needs one at
      # all only because the rule now lives in a repository script rather than inline here.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate PR title
        env:
          # Passed through the environment rather than interpolated into the script, so a title
          # containing shell metacharacters cannot break out of the string.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Known bots are exempt. Their pull request titles are set by the app and cannot be
          # renamed before the check runs — Renovate's onboarding pull request is titled
          # "Configure Renovate", which no amount of convention will fix. Its ongoing pull requests
          # are titled "chore(deps): …" and would pass anyway, so the exemption costs almost nothing.
          #
          # The exemption is keyed on the *author*, not on the title. Allowing a title pattern would
          # let a human open "Configure Renovate" and skip the rule; allowing an account cannot.
          #
          # This exits 0 rather than skipping the job. A skipped check is not a passing check, so if
          # this is ever made a required status check, skipping would block every bot pull request
          # instead of exempting it.
          case "$PR_AUTHOR" in
            'renovate[bot]'|'dependabot[bot]'|'github-actions[bot]'|'pre-commit-ci[bot]')
              echo "::notice::$PR_AUTHOR is a known bot; the title convention is not enforced."
              exit 0
              ;;
          esac

          # The same script the commits job runs, so the type list and the shape of the rule exist
          # once. The two limits differ on purpose -- 70 for a title, 72 for a subject -- and both
          # live in the script rather than one here and one there.
          python3 tools/check_commit_subjects.py --subject "$PR_TITLE" --author "$PR_AUTHOR"

  # **The title is not what lands.** When a squash merge has a single commit to squash, GitHub uses
  # that commit's subject rather than the pull request title. On 2026-09-11 a `verify:` subject
  # reached `main` this way: the title check failed, the title was renamed to `docs:`, and the merge
  # still took the subject from the commit. The title job was green and the convention was broken.
  #
  # So the subjects are checked too. A pull request whose title passes and whose commits do not is
  # exactly the case that slipped through.
  commits:
    name: conventional commit subjects
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit's parents are what the range below needs, and a shallow clone does not
          # have them.
          fetch-depth: 0
          # This job only reads history. Leaving the token in .git/config would hand it to anything
          # that later uploads the workspace as an artifact.
          persist-credentials: false
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # The bot exemption moved into the script with the rest, so the list of exempt accounts
          # exists once. It was inline here as well, which is two lists that can disagree about who
          # is exempt.
          #
          # **One implementation, called from two places.** The validation used to live here as
          # inline shell, which meant the machine that wrote the commit had no way to run it: the
          # only copy was in CI. On 2026-09-13 a 76-character subject reached main while this job was
          # red, because the result arrived after the merge rather than before the push. The script
          # below is also what `make all` runs, so the pattern and the length limit cannot drift
          # between the two.
          python3 tools/check_commit_subjects.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
