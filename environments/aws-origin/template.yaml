AWSTemplateFormatVersion: "2010-09-09"

# Collect-side (origin) verification environment for S3 Burst on ONTAP Files.
#
# This deploys the AWS half of the architecture: the Amazon FSx for NetApp ONTAP file system that
# holds the origin volume, an SVM, the origin volume itself, and a Linux host inside the same subnet
# from which the verification is run.
#
# Why the host is part of the template rather than an afterthought:
#
#   * The ONTAP management endpoint is reachable only from inside the VPC. Every ONTAP REST or CLI
#     step — including creating a FlexCache relationship, which has no AWS API at all — has to run
#     from in-VPC. Without a host in the template, the first thing anybody does is improvise one.
#   * Measuring when a write on one protocol becomes visible on the other requires the write and the
#     read to share a clock. Two hosts means comparing two clocks, and at the millisecond scale that
#     is not a measurement.
#
# The S3 Access Point is deliberately *not* here, and the reason changed on 2026-08-26 without the
# decision changing. `AWS::FSx::S3AccessPointAttachment` exists, so it is no longer impossible to
# declare here; it is still separated, because the access point is the part that gets renamed,
# re-scoped and rebuilt while the volume stays put, and its whole configuration is create-only. A
# policy edit in this stack would replace the access point. `patterns/collect/s3-access-point-attachment/`
# owns it in a stack whose deletion cannot take a volume with it.
Description: >-
  S3 Burst on ONTAP Files — collect-side (origin) verification environment.
  FSx for NetApp ONTAP file system, SVM, origin volume, and an in-VPC verification host.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network
        Parameters:
          - VpcId
          - SubnetId
      - Label:
          default: FSx for ONTAP
        Parameters:
          - FileSystemName
          - StorageCapacityGiB
          - ThroughputCapacityMBps
          - SvmName
          - OriginVolumeName
          - OriginVolumeSizeMB
          - OriginVolumeSecurityStyle
      - Label:
          default: Verification host
        Parameters:
          - DeployVerificationHost
          - HostInstanceType
          - HostVolumeSizeGiB
      - Label:
          default: Tagging
        Parameters:
          - ProjectName
          - Environment
    ParameterLabels:
      OriginVolumeSecurityStyle:
        default: Origin volume security style (decides the fan-out protocol)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Subnet for both the file system and the verification host. Deliberately one subnet: the host
      has to reach the ONTAP management endpoint, and a single-AZ deployment keeps the measurement
      free of cross-AZ latency.

  FileSystemName:
    Type: String
    Default: s3burst-origin
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    Description: Name tag for the file system.

  StorageCapacityGiB:
    Type: Number
    Default: 1024
    MinValue: 1024
    MaxValue: 65536
    Description: >-
      SSD capacity. 1024 GiB is the documented minimum for a single HA pair. Note that SSD capacity
      is billed on what is provisioned, not on what is used.

  ThroughputCapacityMBps:
    Type: Number
    Default: 128
    AllowedValues: [128, 256, 512, 1024, 2048, 4096]
    Description: >-
      Provisioned throughput, billed whether or not it is used, and the ceiling a throughput
      measurement against this file system is measuring. 128 is the tier the visibility records were
      taken on, so it is the tier that compares with them. It is also the reason a throughput figure
      from this stack is not comparable, as a bare number, with one from an elastic service: this
      value was purchased, the elastic one was not. Raising it is an online update and takes tens of
      minutes; the cost of the higher tiers is the reason it is not the default.

  SvmName:
    Type: String
    Default: origin_svm
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{1,46}$"
    Description: >-
      SVM name. ONTAP accepts only alphanumerics and underscores here, which is why this pattern
      differs from the hyphenated names used elsewhere in the stack.

  OriginVolumeName:
    Type: String
    Default: origin_vol
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{1,46}$"
    Description: Origin volume name. Alphanumerics and underscores only.

  OriginVolumeSizeMB:
    Type: Number
    Default: 10240
    MinValue: 20
    Description: Origin volume size in MiB.

  OriginVolumeSecurityStyle:
    Type: String
    Default: UNIX
    AllowedValues: [UNIX, NTFS]
    Description: >-
      UNIX pairs with NFS on the fan-out side, NTFS pairs with SMB. MIXED is deliberately not
      offered: AWS describes it as for advanced users only. Whether the cache inherits this from the
      origin is unconfirmed on this architecture's main path; if it does, changing it later means
      rebuilding the serve layer, which is why deciding before the volume exists is the safe order.
      NTFS additionally needs a CIFS server on the SVM, which this template does not create; an
      Active Directory join is one way to get one, workgroup mode is the documented alternative.

  DeployVerificationHost:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to false if you already have an in-VPC host. Without one, no ONTAP-level step and no
      single-clock measurement is possible.

  HostInstanceType:
    Type: String
    Default: t3.small
    Description: >-
      t3.small is enough for the visibility and semantics work, where the host issues one request at
      a time and its network is nowhere near the limit. It is not enough for a throughput
      measurement, and the reason is worth stating because the failure is silent: if the instance
      network saturates first, the result is a measurement of EC2 network credits wearing the
      storage's name, and nothing in the output says so. For the throughput runs this is set to
      c5n.9xlarge, whose published network figure is a flat 50 Gbps. Most smaller c5n sizes are
      quoted as "Up to 25 Gbps", which is a burst ceiling with a lower sustained baseline, so they
      cannot rule the client out at the 2048 MBps tier (16.4 Gbps) or against a service documented
      to serve up to 3 GiB/s to one client (24 Gbps). c5n.9xlarge is the smallest c5n with a figure
      that is not prefixed "Up to", and its 36 vCPU keep 64 concurrent TLS streams off the CPU as a
      second confound. It is not free: $2.448/h against $0.272/h for c5n.xlarge in ap-northeast-1
      (on-demand Linux, effective 2026-08-01), which is why it is not the default and why the runs
      are short.

  HostVolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 8
    Description: Root volume size for the verification host.

  AssociatePublicIp:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Leave false where the subnet reaches AWS services through a NAT gateway or VPC endpoints. Set
      true only in a subnet that has neither, because Session Manager needs to reach the SSM
      endpoints and a host with no route to them registers nowhere and cannot be reached at all —
      the instance comes up healthy and is simply absent from Session Manager, which is a confusing
      way to lose twenty minutes. A public IP is not an inbound path here: the host security group
      has no inbound rule.

  HostS3DataAccess:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Grants the host the S3 data-path actions, needed only when the host itself drives the
      measurement rather than just mounting. Off by default so the ordinary verification host keeps
      read-only FSx for ONTAP permissions and no write path to object storage.

  HostS3ResourceArns:
    Type: CommaDelimitedList
    Default: "*"
    Description: >-
      What HostS3DataAccess applies to. The default is "*" and that is deliberately visible rather
      than hidden: the S3 Access Point is created by a separate stack and an S3 Files bucket by a
      separate runbook, so neither ARN exists when this template is deployed. Narrow it to the two
      ARNs once they do, especially in an account shared with other people's buckets.

  ProjectName:
    Type: String
    Default: s3-burst-on-ontap-files
    Description: Applied as a tag to every resource.

  Environment:
    Type: String
    Default: verify
    AllowedValues: [verify, dev, stg]
    Description: >-
      Applied as a tag. There is no prod value on purpose — this stack builds a verification
      environment and should not be mistaken for a production pattern.

Conditions:
  WantHost: !Equals [!Ref DeployVerificationHost, "true"]
  WantPublicIp: !Equals [!Ref AssociatePublicIp, "true"]
  WantS3DataAccess: !And
    - !Equals [!Ref DeployVerificationHost, "true"]
    - !Equals [!Ref HostS3DataAccess, "true"]

Resources:
  # ---------------------------------------------------------------------------------------------
  # ONTAP administrative credential
  #
  # Generated here and never printed. The gap this closes is concrete: in an existing verification
  # account the fsxadmin secret named a file system that no longer existed, so the ONTAP-only steps
  # could not be run at all and the FlexCache half of the verification stalled. A file system whose
  # credential is created alongside it does not develop that problem.
  # ---------------------------------------------------------------------------------------------
  OntapAdminSecret:
    Type: AWS::SecretsManager::Secret
    # checkov:skip=CKV_AWS_149: encrypted with the service-managed key. A customer managed key would
    # add a resource whose deletion has a mandatory 7-to-30-day waiting period to the teardown path
    # of a verification environment, which is the one place this repository keeps deletable on the
    # same day. Use a CMK where the key policy is itself part of the control being demonstrated.
    Properties:
      Name: !Sub "${ProjectName}/${FileSystemName}/fsxadmin"
      Description: !Sub "fsxadmin credential for the ${FileSystemName} FSx for ONTAP file system."
      GenerateSecretString:
        SecretStringTemplate: '{"username":"fsxadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        # All punctuation is excluded, and the reason is worth the space because the failure mode is
        # silent and expensive.
        #
        # This previously excluded only '"@/\:;,`$'. A file system created with that setting got a
        # generated password containing ! # < > ] ^ | } and **the password in the secret was not the
        # password the file system ended up with.** Creation succeeded, the stack reported
        # CREATE_COMPLETE, and the defect only appeared later as HTTP 401 from the ONTAP REST API
        # with the body {"error":{"code":"6691623","message":"User is not authorized."}} -- a message
        # that points at permissions rather than at authentication, so the obvious next move is to
        # go and check roles that were never the problem.
        #
        # Everything that matters about this architecture's serve side is ONTAP-only: FlexCache,
        # cluster peering and SVM peering have no AWS API. So a file system whose fsxadmin credential
        # does not work is a file system on which the serve side cannot be built at all, and nothing
        # in the AWS console says so.
        #
        # Which character was responsible was not identified. Excluding all punctuation removes the
        # question rather than answering it, which is the right trade here: 32 alphanumeric
        # characters is about 190 bits, so nothing is lost by dropping the symbols.
        # RequireEachIncludedType keeps upper, lower and digits all present for ONTAP's complexity
        # requirement.
        ExcludePunctuation: true
        RequireEachIncludedType: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------------------------
  # FSx for ONTAP
  # ---------------------------------------------------------------------------------------------
  FileSystem:
    Type: AWS::FSx::FileSystem
    # A deletion policy of Delete is correct for a verification environment and wrong for anything
    # else. Note that no immutability feature is enabled anywhere in this template: SnapLock,
    # tamperproof snapshots and their retention parameters are absent on purpose, because enabling
    # one makes the volume, its SVM and the whole file system undeletable for the retention period.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      FileSystemType: ONTAP
      StorageType: SSD
      StorageCapacity: !Ref StorageCapacityGiB
      SubnetIds:
        - !Ref SubnetId
      SecurityGroupIds:
        - !Ref FileSystemSecurityGroup
      OntapConfiguration:
        DeploymentType: SINGLE_AZ_1
        ThroughputCapacity: !Ref ThroughputCapacityMBps
        PreferredSubnetId: !Ref SubnetId
        FsxAdminPassword: !Sub "{{resolve:secretsmanager:${OntapAdminSecret}:SecretString:password}}"
      Tags:
        - Key: Name
          Value: !Ref FileSystemName
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  StorageVirtualMachine:
    Type: AWS::FSx::StorageVirtualMachine
    Properties:
      FileSystemId: !Ref FileSystem
      Name: !Ref SvmName
      RootVolumeSecurityStyle: !Ref OriginVolumeSecurityStyle
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  OriginVolume:
    Type: AWS::FSx::Volume
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Ref OriginVolumeName
      VolumeType: ONTAP
      OntapConfiguration:
        StorageVirtualMachineId: !Ref StorageVirtualMachine
        SizeInMegabytes: !Ref OriginVolumeSizeMB
        SecurityStyle: !Ref OriginVolumeSecurityStyle
        JunctionPath: !Sub "/${OriginVolumeName}"
        StorageEfficiencyEnabled: true
        OntapVolumeType: RW
        SnapshotPolicy: default
        TieringPolicy:
          Name: SNAPSHOT_ONLY
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------------------------
  # Security groups
  #
  # Two groups referencing each other rather than a CIDR, so the rules stay correct if the subnet is
  # re-addressed, and so nothing outside the stack gains access by being in the right range.
  # ---------------------------------------------------------------------------------------------
  FileSystemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${FileSystemName} FSx for ONTAP. Ingress from the verification host only."
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: ONTAP needs outbound for its own service traffic.
      Tags:
        - Key: Name
          Value: !Sub "${FileSystemName}-fsx"
        - Key: Project
          Value: !Ref ProjectName

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WantHost
    Properties:
      GroupDescription: !Sub "${FileSystemName} verification host. No inbound, access is via SSM."
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          # Two EC2 limits apply to a rule description and neither is visible to cfn-lint, so both
          # are enforced by `make sg-descriptions` instead:
          #
          #   1. Only a-zA-Z0-9 and . _-:/()#,@[]+=&;{}!$* are accepted. An em dash, an apostrophe
          #      or a quote fails the create with `Invalid rule description`, whose message lists
          #      what is allowed rather than what was rejected.
          #   2. The limit is 255 characters.
          #
          # Explanations therefore live in comments like this one, which have neither limit, and the
          # description below stays short and plainly punctuated.
          Description: >-
            Outbound for SSM, Secrets Manager, the S3 data path and package installation. No inbound
            rule exists at all: the host is reached through Session Manager.
      Tags:
        - Key: Name
          Value: !Sub "${FileSystemName}-verify-host"
        - Key: Project
          Value: !Ref ProjectName

  FsxFromHostNfs:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WantHost
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref HostSecurityGroup
      Description: NFS data.

  FsxFromHostPortmap:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WantHost
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 111
      ToPort: 111
      SourceSecurityGroupId: !Ref HostSecurityGroup
      Description: rpcbind, required by NFSv3.

  FsxFromHostMount:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WantHost
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 635
      ToPort: 635
      SourceSecurityGroupId: !Ref HostSecurityGroup
      Description: mountd, required by NFSv3.

  FsxFromHostNlm:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WantHost
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 4045
      ToPort: 4046
      SourceSecurityGroupId: !Ref HostSecurityGroup
      Description: NLM and NSM, required for NFSv3 locking.

  FsxFromHostManagement:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WantHost
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref HostSecurityGroup
      Description: >-
        ONTAP REST API. This is the only route to FlexCache, which has no AWS API, so a stack without
        this rule cannot complete the serve side.

  FsxFromHostSsh:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WantHost
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref HostSecurityGroup
      Description: ONTAP CLI over SSH, for the steps the REST API does not cover.

  # ---------------------------------------------------------------------------------------------
  # Verification host
  # ---------------------------------------------------------------------------------------------
  HostRole:
    Type: AWS::IAM::Role
    Condition: WantHost
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-ontap-credential
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Scoped to this stack's secret. The instance needs it because every ONTAP-level step
              # runs from here; in an existing account the instance role could not read the fsxadmin
              # secret at all, which is what stopped the FlexCache work.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OntapAdminSecret
        - PolicyName: describe-this-file-system
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The Describe* calls do not accept resource-level conditions, so they are granted on
              # "*" and kept read-only. Nothing here can change or delete a file system.
              - Effect: Allow
                Action:
                  - fsx:DescribeFileSystems
                  - fsx:DescribeStorageVirtualMachines
                  - fsx:DescribeVolumes
                  - fsx:DescribeS3AccessPointAttachments
                Resource: "*"
        - !If
          - WantS3DataAccess
          - PolicyName: s3-data-path
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # The object actions the measurement scripts use, and nothing administrative: no
                # CreateBucket, no DeleteBucket, no policy or versioning changes. The version-scoped
                # actions are here because an S3 Files bucket must have versioning on, so an
                # overwrite leaves a previous version behind and a cleanup that only removes current
                # versions leaves the bucket non-empty.
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:DeleteObject
                    - s3:GetObjectVersion
                    - s3:DeleteObjectVersion
                    - s3:AbortMultipartUpload
                    - s3:ListMultipartUploadParts
                    - s3:ListBucket
                    - s3:ListBucketVersions
                    - s3:ListBucketMultipartUploads
                    - s3:GetBucketLocation
                  Resource: !Ref HostS3ResourceArns
                # Mounting an S3 Files file system is authorised by these, not by the s3: actions
                # above. ClientRootAccess is included because objects arriving over the S3 API
                # materialise owned by root, and without it a directory so created cannot be written
                # to from the mount even by the access point's own POSIX identity.
                - Effect: Allow
                  Action:
                    - s3files:ClientMount
                    - s3files:ClientWrite
                    - s3files:ClientRootAccess
                    # ListMountTargets and GetFileSystem, not Describe*: the s3files API has no
                    # Describe action of any kind, and cfn-lint is what caught the invented one.
                    - s3files:ListMountTargets
                    - s3files:GetFileSystem
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - elasticfilesystem:ClientMount
                    - elasticfilesystem:ClientWrite
                    - elasticfilesystem:ClientRootAccess
                  Resource: "*"
                - Effect: Allow
                  Action: cloudwatch:GetMetricStatistics
                  Resource: "*"
          - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: WantHost
    Properties:
      Roles:
        - !Ref HostRole

  VerificationHost:
    Type: AWS::EC2::Instance
    Condition: WantHost
    Properties:
      # Resolved from the SSM public parameter rather than a hardcoded AMI ID, which is Region- and
      # date-specific and is the usual reason a template stops deploying months later.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref HostInstanceType
      IamInstanceProfile: !Ref HostProfile
      # Two mutually exclusive shapes. EC2 rejects SubnetId and SecurityGroupIds alongside
      # NetworkInterfaces, and AssociatePublicIpAddress exists only on the latter, so the choice has
      # to be made at the property level rather than by adding one flag.
      SubnetId: !If [WantPublicIp, !Ref AWS::NoValue, !Ref SubnetId]
      SecurityGroupIds:
        !If [WantPublicIp, !Ref AWS::NoValue, [!Ref HostSecurityGroup]]
      NetworkInterfaces: !If
        - WantPublicIp
        - - DeviceIndex: "0"
            AssociatePublicIpAddress: true
            SubnetId: !Ref SubnetId
            GroupSet:
              - !Ref HostSecurityGroup
            DeleteOnTermination: true
        - !Ref AWS::NoValue
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref HostVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y nfs-utils jq >/dev/null 2>&1 || yum install -y nfs-utils jq >/dev/null 2>&1

          # python3.12 explicitly, not the distribution default. On Amazon Linux 2023 that default is
          # 3.9, where datetime.UTC does not exist, so every measurement script here fails on import
          # with a name that gives no hint that the interpreter is the problem.
          dnf install -y python3.12 python3.12-pip >/dev/null 2>&1 || true
          python3.12 -m pip install --quiet boto3 >/dev/null 2>&1 || true

          # Two mount points, because the client cache decides what a reader sees and the difference
          # is large. With Linux defaults (acdirmin=30, acdirmax=60) a file that appears in a
          # directory the client has already listed can stay invisible for up to a minute — measured
          # at over two seconds for a delete, and a completed multipart object was still absent
          # after three. actimeo=0 shows what the storage is actually doing.
          mkdir -p /mnt/origin-noac /mnt/origin-cached
          cat >/etc/profile.d/s3burst.sh <<'PROFILE'
          export S3BURST_NFS_NOAC=/mnt/origin-noac
          export S3BURST_NFS_CACHED=/mnt/origin-cached
          echo "mount with:"
          echo "  sudo mount -t nfs -o nfsvers=3,actimeo=0 <svm-nfs-ip>:/${OriginVolumeName} /mnt/origin-noac"
          echo "  sudo mount -t nfs -o nfsvers=3          <svm-nfs-ip>:/${OriginVolumeName} /mnt/origin-cached"
          PROFILE
      Tags:
        - Key: Name
          Value: !Sub "${FileSystemName}-verify-host"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  FileSystemId:
    Description: FSx for ONTAP file system holding the origin volume.
    Value: !Ref FileSystem

  HowToReadTheOntapVersion:
    Description: >-
      Every published measurement has to state the ONTAP version, and CloudFormation cannot supply
      it: AWS::FSx::FileSystem exposes only ResourceARN, Id, DNSName, RootVolumeId and
      LustreMountName, so there is no attribute to output. The FSx for ONTAP API is not dependable
      either — on
      an existing file system DescribeFileSystems omitted FileSystemTypeVersion entirely. The
      reliable source is ONTAP itself, which is why this stack ships the credential and the port to
      reach it.
    Value: !Sub >-
      aws fsx describe-file-systems --region ${AWS::Region} --file-system-ids ${FileSystem}
      --query 'FileSystems[0].FileSystemTypeVersion' ; if that is null, from the verification host:
      curl -s -k -u fsxadmin:<secret> https://management.${FileSystem}.fsx.${AWS::Region}.amazonaws.com/api/cluster?fields=version

  ManagementEndpoint:
    Description: >-
      ONTAP management endpoint, reachable from inside the VPC only. Composed rather than read from
      an attribute, because the file system exposes no management-endpoint attribute.
    Value: !Sub "management.${FileSystem}.fsx.${AWS::Region}.amazonaws.com"

  HowToReadTheNfsEndpoint:
    Description: >-
      AWS::FSx::StorageVirtualMachine returns only ResourceARN, UUID and StorageVirtualMachineId, so
      the NFS endpoint cannot be output either. Read it after the stack settles.
    Value: !Sub >-
      aws fsx describe-storage-virtual-machines --region ${AWS::Region}
      --storage-virtual-machine-ids ${StorageVirtualMachine}
      --query 'StorageVirtualMachines[0].Endpoints.Nfs.IpAddresses[0]' --output text

  StorageVirtualMachineId:
    Description: SVM that owns the origin volume.
    Value: !Ref StorageVirtualMachine

  OriginVolumeId:
    Description: Origin volume. Attach the S3 Access Point to this one, and nothing else.
    Value: !Ref OriginVolume

  OriginJunctionPath:
    Description: Junction path of the origin volume.
    Value: !Sub "/${OriginVolumeName}"

  SecurityStyle:
    Description: >-
      Security style of the origin volume, which bears on the protocol the fan-out side can use.
    Value: !Ref OriginVolumeSecurityStyle

  OntapAdminSecretArn:
    Description: >-
      Secret holding the fsxadmin credential. Only the verification host can read it. Never print the
      value into a log, an issue or a commit.
    Value: !Ref OntapAdminSecret

  HostSecurityGroupId:
    Condition: WantHost
    Description: >-
      The security group on the verification host. Other stacks take this as input rather than a CIDR
      so that they grant access to this host and not to whatever else shares its range: the S3 Files
      comparison stack uses it as the source of its NFS ingress rule.
    Value: !Ref HostSecurityGroup

  HostRoleArn:
    Condition: WantHost
    Description: >-
      The host role, which is the principal to name in an S3 Access Point policy so that only this
      host can write through it.
    Value: !GetAtt HostRole.Arn

  VerificationHostId:
    Condition: WantHost
    Description: >-
      Verification host. Connect with Session Manager; it has no inbound rule and no key pair.
    Value: !Ref VerificationHost

  CreateAccessPointCommand:
    Description: >-
      How to attach an S3 Access Point to the origin volume. Preferred:
      patterns/collect/s3-access-point-attachment/, which declares
      AWS::FSx::S3AccessPointAttachment and gives the access point its own stack. The CLI form below
      is the alternative for a one-off — pass a JSON file rather than positional arguments, because
      the positional form of --ontap-configuration parses unreliably.
    Value: !Sub >-
      aws cloudformation deploy --template-file patterns/collect/s3-access-point-attachment/template.yaml
      --stack-name <name> --region ${AWS::Region}
      --parameter-overrides VolumeId=${OriginVolume} AccessPointName=<name> ...
      # or: aws fsx create-and-attach-s3-access-point --region ${AWS::Region}
      # --cli-input-json file://access-point.json

  NextStep:
    Description: What to do once this stack is CREATE_COMPLETE.
    Value: >-
      Follow docs/ja/deployment/aws-cloudformation.md: create the S3 Access Point, mount the origin
      volume on the verification host, then deploy the serve side with
      environments/onprem-cache/ before running the end-to-end checks in docs/ja/poc-checklist.md.

