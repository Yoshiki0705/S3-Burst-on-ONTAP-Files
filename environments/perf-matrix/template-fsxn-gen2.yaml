AWSTemplateFormatVersion: "2010-09-09"
# =================================================================================================
# DEPLOYED AND TORN DOWN 2026-09-05. Results in docs/ja/verification/perf-matrix-results.md.
# Second-generation FSx for ONTAP for the E pattern.
#
# Why a second file system exists at all, when a first-generation one is already deployed:
#
# **The first-generation write ceiling does not move.** A first-generation Single-AZ file system in
# ap-northeast-1 stops at 750 MBps for writes and 2,048 MBps for reads, per HA pair, and it has one
# HA pair. Raising the throughput capacity does not raise those. Amazon EFS in the same Region
# reaches 5 GiBps write and 60 GiBps read per file system on Elastic throughput, so showing anything
# beyond the first generation's range needs the second generation, which delivers 6,144 MBps read
# and 1,024 MBps write per HA pair and scales to 12 pairs.
#
# This stack provisions one pair at 6,144 MBps. That is the ceiling comparison, not a like-for-like
# cost comparison: second-generation throughput capacity costs $2.013 per MBps-month against the
# first generation's $0.906, so per MBps purchased the first generation is cheaper. What the second
# generation buys is a range the first generation cannot reach at any price.
#
# Cost, at ap-northeast-1 On-Demand prices read from the Price List API on 2026-09-04:
#   6,144 MBps x $2.013            = $12,368 / month
#   200,000 SSD IOPS above the free 3 per GiB = about $4,017 / month
#   1,024 GiB SSD x $0.15          = $154 / month
#   total, about $16,812 / month at 4,096 GiB of SSD, or **$23.03 / hour**
#
# **This is the most expensive resource in the measurement after EFS Provisioned.** Delete it as soon
# as the E pattern is done. Reducing ThroughputCapacityPerHAPair is the cheaper lever, but the
# change takes time to apply -- 24 minutes was measured for a first-generation 128 to 2048 change --
# so a teardown at the end of the window is the plan, not a step-down between patterns.
#
# SnapLock, retention and privileged-delete are absent on purpose. Nothing here should be capable of
# making a volume, an SVM or the file system undeletable; the whole point is that it is deleted.
# =================================================================================================
Description: >-
  DEPLOYED AND TORN DOWN 2026-09-05. Second-generation Single-AZ FSx for ONTAP file system, SVM and volume for the E
  ceiling-comparison pattern, in an existing VPC and subnet.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Placement (must match the other targets and the clients)}
        Parameters: [VpcId, SubnetId, ClientSecurityGroupId, AdSecurityGroupId]
      - Label: {default: Performance}
        Parameters: [ThroughputCapacityPerHAPair, StorageCapacityGiB, ProvisionedSsdIops]
      - Label: {default: Volume}
        Parameters: [VolumeSizeBytes]
      - Label: {default: Naming and credentials}
        Parameters: [NamePrefix, FsxAdminPasswordSecretArn]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Single-AZ, so one subnet. Use the same one as the clients.
  ClientSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: NFS and the ONTAP management port are allowed from this group only.
  AdSecurityGroupId:
    Type: String
    Default: ""
    Description: >-
      The security group AWS Managed AD created for its domain controllers, from
      `aws ds describe-directories`. Leave empty for an NFS-only deployment. When set, SMB ingress and
      outbound to the controllers are added -- **an AD-joined SVM cannot complete its join without the
      outbound rule**, because the rest of this file deliberately has no egress at all.
  ThroughputCapacityPerHAPair:
    Type: Number
    Default: 6144
    AllowedValues: [1536, 3072, 6144]
    Description: >-
      The only values SINGLE_AZ_2 accepts. 6144 gives 6,144 MBps read and 1,024 MBps write per pair,
      and an NVMe read cache of 1,900 GB with 256 GB in memory. 3072 is the cheaper option that still
      exceeds the first generation's 750 MBps write ceiling.
  StorageCapacityGiB:
    Type: Number
    Default: 4096
    MinValue: 1024
    Description: >-
      **Sized for IOPS, not for data.** Two 900 GiB volumes need 2,048 GiB, but FSx for ONTAP caps
      provisioned SSD IOPS at 50 per GB of SSD, so 200,000 IOPS needs at least 4,000 GiB. The extra
      capacity is what stops SSD IOPS from binding before the throughput capacity does -- see
      ProvisionedSsdIops. The data itself only has to exceed the 256 GB in-memory cache, which is why
      the volumes are far smaller than this.
  ProvisionedSsdIops:
    Type: Number
    Default: 200000
    # **This value is tied to StorageCapacityGiB and the tie is not a soft limit.** FSx for ONTAP
    # refuses more than 50 provisioned SSD IOPS per GB of SSD, and refuses it at create time with a
    # BadRequest that costs a full stack rollback to discover:
    #
    #   Invalid SSD IOPS provided: 200000 IOPS. [...] does not support provisioning more than
    #   50 IOPS per GB of SSD storage capacity on a ONTAP file system.
    #
    # (The elided word is the service name in its short form, which this repository does not use.)
    #
    # So 200,000 IOPS needs at least 4,000 GiB of SSD. That is why the SSD here is far larger than the
    # data being read: it is bought for the IOPS, not for the capacity. `runbook.sh gen2` checks the
    # ratio before calling CloudFormation.
    #
    # Why this many: with the NVMe cache off, a read is served from SSD, so SSD IOPS can become the
    # binding limit instead of the throughput capacity -- and a result limited by IOPS recorded as a
    # throughput ceiling is simply wrong. 6,144 MB/s needs about 98,300 IOPS at 64 KiB. At 2,048 GiB
    # the ceiling would be 102,400, a 4% margin. At 4,096 GiB it is 204,800, so throughput binds first
    # and the figure measures what it claims to.
    Description: >-
      The SSD IOPS baseline at 6,144 MBps. Provisioned rather than AUTOMATIC, because AUTOMATIC gives
      3 IOPS per GiB and would make IOPS the binding constraint instead of the thing being measured.
  VolumeSizeBytes:
    Type: String
    AllowedPattern: "^[0-9]{11,13}$"
    Description: >-
      Volume size in bytes, which is the unit the API takes. No default, and no GiB-to-bytes mapping
      in this file: CloudFormation has no multiplication, string concatenation produces a number that
      looks right and is not, and a table of byte literals here is indistinguishable from a table of
      account IDs to a secret scanner. runbook.sh computes it, where arithmetic exists. Size it to
      hold more than twice the 256 GB in-memory cache, which is what a read has to exceed once the
      NVMe read cache is disabled -- 900 GiB is what the runbook passes.
  NamePrefix:
    Type: String
    Default: perfmatrix
    AllowedPattern: "^[a-z0-9-]{3,20}$"
  FsxAdminPasswordSecretArn:
    Type: String
    Description: >-
      ARN of an existing Secrets Manager secret holding the fsxadmin password. Passed by reference so
      the password is never a template parameter, a stack event or a console field.
    AllowedPattern: "^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"

Conditions:
  HasAd: !Not [!Equals [!Ref AdSecurityGroupId, ""]]

Resources:
  FileSystemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix} gen2 FSx for ONTAP: NFS and ONTAP management from the clients"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 111
          ToPort: 111
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: rpcbind, needed by NFSv3
        - IpProtocol: udp
          FromPort: 111
          ToPort: 111
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: rpcbind over UDP, needed by NFSv3
        - IpProtocol: tcp
          FromPort: 635
          ToPort: 635
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: mountd, needed by NFSv3
        - IpProtocol: udp
          FromPort: 635
          ToPort: 635
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: mountd over UDP, needed by NFSv3
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: NFS, all versions
        - IpProtocol: udp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: NFS over UDP, needed by NFSv3
        - IpProtocol: tcp
          FromPort: 4045
          ToPort: 4046
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: NFS lock manager and status monitor, needed by NFSv3
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: ONTAP CLI, used to disable the NVMe read cache before the disk-path measurement
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: ONTAP REST API, used to read volume counters during a measurement
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: >-
            No egress needed for NFS or the management path. This placeholder exists because omitting
            SecurityGroupEgress would let CloudFormation add allow-all.
      Tags:
        - {Key: Name, Value: !Sub "${NamePrefix}-gen2-fs-sg"}
        - {Key: DeleteAfterMeasurement, Value: "true"}

  # The SMB path, added only when a directory exists. Separate resources rather than more entries in
  # the lists above, so an NFS-only deployment produces exactly the rules it did before this was added.
  SmbFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAd
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 445
      ToPort: 445
      SourceSecurityGroupId: !Ref ClientSecurityGroupId
      Description: >-
        SMB from the measurement clients. Port 139 is not opened: SMB 2.0 and later do not use NetBIOS
        session service, and every dialect being measured here is 2.0 or later.

  # Without this the join fails, and it fails in a way that reads as a permissions problem. An
  # AD-joined SVM contacts its controllers for Kerberos, LDAP and the win-to-unix name-mapping lookup
  # that ONTAP performs on file system operations once CIFS is enabled.
  AdOutbound:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasAd
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: "-1"
      DestinationSecurityGroupId: !Ref AdSecurityGroupId
      # The AD port set spans TCP and UDP from 53 through the dynamic RPC range at 49152-65535, so
      # enumerating it as fifteen rules would not narrow which hosts can be reached. That is already
      # just this one group. (EC2 caps a rule description at 255 characters, hence the short form.)
      Description: >-
        To the domain controllers only, named by security group rather than address

  FileSystem:
    Type: AWS::FSx::FileSystem
    # Retain would be the wrong default here: this file system costs $23.03/hour and exists to be
    # deleted. Delete means a failed rollback does not leave it running.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      FileSystemType: ONTAP
      StorageType: SSD
      StorageCapacity: !Ref StorageCapacityGiB
      SubnetIds: [!Ref SubnetId]
      SecurityGroupIds: [!Ref FileSystemSecurityGroup]
      OntapConfiguration:
        DeploymentType: SINGLE_AZ_2
        # One pair. Reaching EFS's 60 GiBps read would take eleven, which is not a cost this
        # measurement justifies -- the point is that the first generation's range ends, not that
        # this one matches EFS.
        HAPairs: 1
        # Set per pair rather than in total. With one pair the two are equal, but writing it this way
        # means adding a pair does not silently divide the per-pair capacity.
        ThroughputCapacityPerHAPair: !Ref ThroughputCapacityPerHAPair
        DiskIopsConfiguration:
          Mode: USER_PROVISIONED
          Iops: !Ref ProvisionedSsdIops
        FsxAdminPassword: !Sub "{{resolve:secretsmanager:${FsxAdminPasswordSecretArn}:SecretString:password}}"
        # 0, and this one is not a preference.
        #
        # The default is 30 days with a daily backup at a fixed time, and a backup takes an ONTAP
        # snapshot. An overwrite-heavy run that crosses that time then cannot reclaim the blocks it
        # overwrites, because the snapshot holds them: on this environment a run that started at
        # 14:30 UTC met the 15:00 UTC backup, the volume went from 88% to 100% full, and write
        # throughput fell from 2,200 MB/s to 267 MB/s before failing outright.
        #
        # Checking `snapshot-policy` and the snapshot count before starting does not catch it --
        # both read clean, because the snapshot does not exist yet.
        AutomaticBackupRetentionDays: 0
      Tags:
        - {Key: Name, Value: !Sub "${NamePrefix}-gen2"}
        - {Key: Purpose, Value: protocol-matrix-measurement}
        - {Key: DeleteAfterMeasurement, Value: "true"}

  # UNIX security style, and no Active Directory. SMB is not measured on this file system: the
  # domain controllers the existing SVMs were joined to no longer exist, so an SMB case here would
  # be blocked on standing up a directory rather than on anything this stack does.
  StorageVirtualMachine:
    Type: AWS::FSx::StorageVirtualMachine
    DeletionPolicy: Delete
    Properties:
      FileSystemId: !Ref FileSystem
      Name: !Sub "${NamePrefix}-gen2-svm"
      RootVolumeSecurityStyle: UNIX
      Tags:
        - {Key: Name, Value: !Sub "${NamePrefix}-gen2-svm"}
        - {Key: DeleteAfterMeasurement, Value: "true"}

  Volume:
    Type: AWS::FSx::Volume
    DeletionPolicy: Delete
    Properties:
      Name: !Sub "${NamePrefix}_gen2_vol"
      VolumeType: ONTAP
      OntapConfiguration:
        StorageVirtualMachineId: !Ref StorageVirtualMachine
        JunctionPath: !Sub "/${NamePrefix}_gen2_vol"
        SecurityStyle: UNIX
        # Required by the API -- omitting it fails validation, and it fails *after* the file system has
        # been built, so the rollback discards about 25 minutes of waiting.
        #
        # false, and that is the measurement's choice rather than a default. The test data is
        # incompressible on purpose (dedup and compression ratios of 1), so inline efficiency has
        # nothing to gain and only adds work on the write path. It also has to be decided now: once
        # data is written, the setting cannot be changed until background processing has finished.
        StorageEfficiencyEnabled: false
        SizeInBytes: !Ref VolumeSizeBytes
        TieringPolicy:
          # No capacity pool tiering. Cold data moving to the pool mid-measurement would change what
          # the disk path is being measured against, and the pool has its own latency profile.
          Name: NONE
        SnapshotPolicy: none
        # A final backup is taken when a volume is deleted unless told not to, and that backup
        # outlives the file system and bills for backup storage. A teardown that checks only for live
        # resources reports success while leaving it behind -- which is what happened here, twice,
        # with 900 GiB and 3,200 GiB volumes.
        SkipFinalBackup: true
      Tags:
        - {Key: Name, Value: !Sub "${NamePrefix}-gen2-vol"}
        - {Key: DeleteAfterMeasurement, Value: "true"}

Outputs:
  FileSystemId:
    Value: !Ref FileSystem
  FileSystemSecurityGroupId:
    Value: !Ref FileSystemSecurityGroup
    Description: >-
      The group on the SVM's network interfaces. The directory's own security group has to admit this
      one on the AD ports, which is what `runbook.sh ad-ports` arranges.
  StorageVirtualMachineId:
    Value: !Ref StorageVirtualMachine
    Description: >-
      The NFS SVM. **Do not join this one to a domain.** Enabling CIFS on an SVM makes ONTAP perform a
      win-to-unix lookup on file system operations, which puts the domain controller on the path of
      every NFS figure measured here. The SMB cases use a second SVM created by template-smb-svm.yaml.
  ManagementEndpointLookup:
    Value: !Sub >-
      aws fsx describe-file-systems --file-system-ids ${FileSystem}
      --query 'FileSystems[0].OntapConfiguration.Endpoints.Management.DNSName' --output text
    Description: >-
      CloudFormation does not return the ONTAP management endpoint, so this is the command that does.
      The ONTAP CLI is where the NVMe read cache gets disabled.
  SvmNfsEndpointLookup:
    Value: !Sub >-
      aws fsx describe-storage-virtual-machines --storage-virtual-machine-ids ${StorageVirtualMachine}
      --query 'StorageVirtualMachines[0].Endpoints.Nfs.DNSName' --output text
    Description: The SVM's NFS DNS name, which is what the clients mount.
  NfsMountHint:
    Value: !Sub "mount -t nfs -o nfsvers=4.1,nconnect=16 <svm-nfs-dns>:/${NamePrefix}_gen2_vol /mnt/bench/gen2"
    Description: >-
      The SVM's NFS DNS name comes from `aws fsx describe-storage-virtual-machines`. nconnect is set
      because a Linux NFS mount opens one TCP connection by default and stops near 590 MB/s.
  DisableNvmeCacheReminder:
    Value: >-
      Before the disk-path measurement, disable the NVMe read cache on both nodes with
      'system node external-cache modify -node * -is-enabled false' over the ONTAP CLI, then confirm
      with 'system node external-cache show'. Without this, a read under 1,900 GB is served from cache
      and the SSD IOPS setting has no effect on it.
  HourlyCostNote:
    Value: !Sub
      - "About $${Hourly} per hour while this stack exists. Delete it when the E pattern is done."
      - Hourly: "23.03 at 6144 MBps with 200,000 provisioned IOPS and 4,096 GiB of SSD"
